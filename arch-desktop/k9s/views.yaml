views:
  v1/pods:
    columns:
      - NAMESPACE
      # Shorten only the display, preserving the suffix that identifies each Pod.
      - 'NAME:.metadata.name | if length > 40 then [.[0:21], .[-16:]] | join("...") else . end'
      - READY
      - STATUS
      - RESTARTS
      - AGE
      - IP
      - NODE
      - CPU
      - "%CPU/R"
      - "%CPU/L"
      - MEM
      - "%MEM/R"
      - "%MEM/L"
      - "PF|H"
      # Keep full names searchable and available in wide mode.
      - "FULL-NAME:.metadata.name|W"
  v1/nodes:
    columns:
      - "INTERNAL-IP|S"
      - "GPU/A|H"
      - "GPU/C|H"
      - "SH-GPU/A|H"
      - "SH-GPU/C|H"
