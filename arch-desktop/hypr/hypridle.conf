general {
    # Every hook also leaves a timestamped line in the journal (journalctl -t
    # hypridle). The 2026-10-01 GPU freeze could not be tied to the lock/DPMS
    # cycle that may have preceded it because nothing recorded those transitions.
    lock_cmd = logger -t hypridle "lock_cmd: hyprlock"; pidof hyprlock || hyprlock
    before_sleep_cmd = logger -t hypridle "before_sleep: lock-session"; loginctl lock-session
    after_sleep_cmd = logger -t hypridle "after_sleep: dpms on"; hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}

listener {
    timeout = 600
    on-timeout = logger -t hypridle "idle 600s: lock-session"; loginctl lock-session
}

listener {
    timeout = 630
    on-timeout = logger -t hypridle "idle 630s: dpms off"; hyprctl dispatch dpms off
    on-resume = logger -t hypridle "resume: dpms on"; hyprctl dispatch dpms on
}
