# Managed by arch-desktop/forensics.tf. Replaces the stock all-comment file; the
# compiled-in defaults still apply to everything not listed here. See
# journald.conf(5).
[Journal]
# Default 5min. After a display freeze this machine gets power-cycled by hand,
# and whatever journald has not synced by then is lost with it. 10s bounds that
# loss to the last few seconds at the cost of one fsync per 10s of new log.
SyncIntervalSec=10s
