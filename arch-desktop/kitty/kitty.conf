# Use Jetendard (installed to ~/.local/share/fonts, from github.com/kuskhan/jetendard):
# JetBrainsMono Nerd Font Mono merged with Pretendard Hangul. The Nerd Font base keeps
# the starship prompt glyphs single-cell (no tofu boxes), and the Korean coverage means
# Hangul in the terminal renders without falling back to another font. Bold/italic styles
# are auto-picked from the family. NOTE: the font is not managed by terraform, so a fresh
# machine needs it installed manually or kitty falls back to monospace (Noto Sans Mono).
font_family Jetendard

include ./solarized_light.conf

# Clipboard copy/paste on Ctrl/Shift+Insert. These pair with the Hyprland
# SUPER+C / SUPER+V binds (hypr/hyprland.lua), which send Ctrl+Insert /
# Shift+Insert to the focused window, so SUPER+C / SUPER+V copy & paste the
# clipboard inside kitty too. kitty's default shift+insert pastes the primary
# selection; this later mapping overrides it (last mapping wins).
map ctrl+insert   copy_to_clipboard
map shift+insert  paste_from_clipboard
