# Scratchpad Kitty: keep the shared font and key mappings, then replace the
# Solarized Light palette with GitHub Light and make only the background
# translucent. Hyprland disables blur for the scratchpad workspace.
include ./kitty.conf

# GitHub Light
# Source: kitty-themes (GitHub, MIT)
foreground #24292f
background #ffffff

selection_foreground #ffffff
selection_background #0969da

cursor            #0969da
cursor_text_color #ffffff

tab_bar_background       #f6f8fa
active_tab_foreground    #24292f
active_tab_background    #ffffff
inactive_tab_foreground  #57606a
inactive_tab_background  #f6f8fa

color0  #24292f
color8  #57606a
color1  #cf222e
color9  #a40e26
color2  #116329
color10 #1a7f37
color3  #4d2d00
color11 #633c01
color4  #0969da
color12 #218bff
color5  #8250df
color13 #a475f9
color6  #1b7c83
color14 #3192aa
color7  #6e7781
color15 #8c959f

# Keep glyphs crisp while allowing the regular workspace to show through.
background_opacity 0.86
